<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>3D Pinball: Space Cadet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #canvas {
      display: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      outline: none;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
    #status {
      position: absolute;
      color: #38bdf8;
      font-family: monospace;
      font-size: 13px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #progress {
      width: 200px;
      height: 10px;
      border-radius: 3px;
      overflow: hidden;
    }
    .controls-hint {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      color: #e2e8f0;
      font-family: monospace;
      font-size: 10.5px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 10px;
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.5s;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="status">
    <div id="status-text">Loading 3D Pinball: Space Cadet...</div>
    <progress id="progress" value="0" max="100" hidden></progress>
  </div>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="hint" class="controls-hint">Space = Plunger | Z / / = Flippers | F2 = New Game</div>

  <script>
    var statusText = document.getElementById("status-text");
    var progressElement = document.getElementById("progress");
    var canvasElement = document.getElementById("canvas");
    var hintElement = document.getElementById("hint");
    var statusContainer = document.getElementById("status");

    var Module = {
      preRun: [],
      postRun: [
        function() {
          if (canvasElement) {
            canvasElement.style.display = "block";
            canvasElement.focus();
          }
          if (statusContainer) {
            statusContainer.style.display = "none";
          }
          setTimeout(function() {
            if (hintElement) hintElement.style.opacity = '0.35';
          }, 7000);
        }
      ],
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: (function() {
        canvasElement.addEventListener("webglcontextlost", function(e) {
          alert("WebGL context lost. Please reload.");
          e.preventDefault();
        }, false);
        return canvasElement;
      })(),
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: "" };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = 100 * parseInt(m[2]);
          progressElement.max = 100 * parseInt(m[4]);
          progressElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) {
            if (statusContainer) statusContainer.style.display = "none";
            if (canvasElement) {
              canvasElement.style.display = "block";
              canvasElement.focus();
            }
          }
        }
        if (statusText) statusText.innerText = text || "";
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "");
      },
      locateFile: function(path, prefix) {
        if (path.endsWith(".wasm") || path.endsWith(".data")) {
          return "https://pinball.alula.me/" + path;
        }
        return prefix + path;
      }
    };

    Module.setStatus("Downloading game data...");
    window.onerror = function(err) {
      console.error("Pinball error:", err);
      if (statusText) statusText.innerText = "Error loading Pinball engine.";
    };

    window.addEventListener('click', function() {
      if (canvasElement) canvasElement.focus();
    });
  </script>
  <script async src="https://pinball.alula.me/SpaceCadetPinball.js"></script>
</body>
</html>
